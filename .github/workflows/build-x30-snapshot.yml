name: Build TOTOLINK X30 KWRT

on:
  workflow_dispatch:
permissions:
  contents: write

env:
  KWRT_BRANCH: "25.12"
  OPENWRT_BRANCH: "openwrt-25.12"
  BUILD_JOBS: "2"
  
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -e
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-pyelftools python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl \
            time jq dwarves llvm libpython3-dev aria2 \
            ccache rename device-tree-compiler \
            libgmp3-dev libmpc-dev libfuse-dev

      - name: Clone KWRT recipes
        shell: bash
        run: |
          set -e
          git clone \
            --depth 1 \
            --branch "${KWRT_BRANCH}" \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

          echo "KWRT HEAD:"
          git -C kwrt log -1 --oneline

      - name: Clone OpenWrt 25.12
        shell: bash
        run: |
          set -e
          git clone \
            --depth 1 \
            --branch "${OPENWRT_BRANCH}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "OpenWrt HEAD:"
          git -C openwrt log -1 --oneline

      - name: Install KWRT customizations
        env:
          REPO_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          # Ikuti struktur build KWRT resmi
          cp -rf kwrt/devices/common/. openwrt/
          cp -rf kwrt/devices/mediatek_filogic/. openwrt/
          cp -rf kwrt/devices openwrt/

          cd openwrt

          # Function yang dibutuhkan oleh KWRT common diy.sh
          function git_clone_path() {
            branch="$1"
            rurl="$2"
            mv_mode="$3"

            if [ "$mv_mode" != "mv" ]; then
              shift 2
            else
              shift 3
            fi

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
              git checkout "$branch"
              cd "$rootdir"
            fi

            cd "$tmpdir"

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [ "$mv_mode" != "mv" ]; then
              cp -rn ./* "$rootdir/"
            else
              mv -n "$@"/* "$rootdir/$@/"
            fi

            cd "$rootdir"
            rm -rf "$tmpdir"
          }

          export -f git_clone_path
          export TARGET="mediatek_filogic"
          export REPO_TOKEN="${REPO_TOKEN}"

          echo "Running KWRT common diy.sh..."
          bash devices/common/diy.sh

          echo "Running KWRT MediaTek Filogic diy.sh..."
          bash devices/mediatek_filogic/diy.sh

          # File overlay KWRT
          cp -Rf ./diy/* ./ 2>/dev/null || true
          
      - name: Apply KWRT patches
        shell: bash
        run: |
          set -e
          cd openwrt

          mkdir -p devices/mediatek_filogic/patches

          if [ -d devices/common/patches ]; then
            cp -rn \
              devices/common/patches/. \
              devices/mediatek_filogic/patches/ || true
          fi

          echo "Applying KWRT revert patches..."

          while IFS= read -r -d '' patchfile; do
            echo "Reverting: $patchfile"

            patch \
              -d ./ \
              -R \
              --no-backup-if-mismatch \
              -p1 \
              -F1 \
              -i "$patchfile"

          done < <(
            find devices/mediatek_filogic/patches \
              -maxdepth 1 \
              -type f \
              -name '*.revert.patch' \
              -print0 | sort -z
          )

          echo "Applying KWRT normal patches..."

          while IFS= read -r -d '' patchfile; do
            echo "Applying: $patchfile"

            patch \
              -d ./ \
              --no-backup-if-mismatch \
              -p1 \
              -F1 \
              -i "$patchfile"

          done < <(
            find devices/mediatek_filogic/patches \
              -maxdepth 1 \
              -type f \
              -name '*.patch' \
              ! -name '*.revert.patch' \
              ! -name '*.bin.patch' \
              -print0 | sort -z
          )

      - name: Fix KWRT APK Packages manifest
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Makefile")
          s = p.read_text()

          old = "\tcp -f $(BIN_DIR)/packages/Packages.manifest $(BIN_DIR)/\n"
          new = "\t[ ! -f $(BIN_DIR)/packages/Packages.manifest ] || cp -f $(BIN_DIR)/packages/Packages.manifest $(BIN_DIR)/\n"

          if old in s:
              print("Fixing obsolete Packages.manifest copy for APK...")
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new in s:
              print("Packages.manifest compatibility fix already applied.")
          else:
              raise SystemExit("ERROR: Packages.manifest line not found in Makefile")
          PY

          grep -n "Packages.manifest" Makefile || true

      - name: Fix KWRT dnsmasq APK ownership
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("package/network/services/dnsmasq/Makefile")
          s = p.read_text()

          # KWRT memasukkan library milik paket lain langsung ke dnsmasq-full.
          # Ini tidak cocok dengan APK karena menyebabkan file ownership conflict.
          libs = [
              "libnftables.so.1",
              "libjansson.so.4",
              "libnftnl.so.11",
              "libmnl.so.0",
          ]

          lines = s.splitlines()
          new_lines = []

          for line in lines:
              if "$(INSTALL_BIN)" in line and any(lib in line for lib in libs):
                  print("Removing:", line.strip())
                  continue
              new_lines.append(line)

          s = "\n".join(new_lines) + "\n"

          # Kembalikan dependency nftables-json yang sebelumnya dihapus patch KWRT.
          if "PACKAGE_dnsmasq_full_nftset:nftables-json" not in s:
              pattern = (
                  r'(\+PACKAGE_dnsmasq_full_conntrack:'
                  r'libnetfilter-conntrack)(\n)'
              )

              replacement = (
                  r'\1 \\\n'
                  r'\t+PACKAGE_dnsmasq_full_nftset:nftables-json\n'
              )

              s, count = re.subn(
                  pattern,
                  replacement,
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: cannot restore dnsmasq nftables-json dependency"
                  )

          p.write_text(s)
          PY

          echo
          echo "Checking dnsmasq Makefile..."

          if grep -nE \
            '\$\(INSTALL_BIN\).*lib(nftables|jansson|nftnl|mnl).*\.so' \
            package/network/services/dnsmasq/Makefile; then
              echo "ERROR: dnsmasq still bundles foreign shared libraries"
              exit 1
          fi

          grep -nE \
            'PACKAGE_dnsmasq_full_(conntrack|nftset)' \
            package/network/services/dnsmasq/Makefile

          echo "dnsmasq APK ownership fix OK"
          
      - name: Fix KWRT APK package versions
        shell: bash
        run: |
          set -e
          cd openwrt

          python3 - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------
          # Fix KWRT base-files date revision for APK
          # ------------------------------------------------
          p = Path("package/base-files/Makefile")
          s = p.read_text()

          old = '$(lastword $(subst -, ,$(REVISION)))'
          new = '$(subst .,,$(lastword $(subst -, ,$(REVISION))))'

          if old in s:
              print("Fixing base-files REVISION for APK...")
              s = s.replace(old, new)
              p.write_text(s)
          elif new in s:
              print("base-files APK revision already fixed.")
          else:
              raise SystemExit(
                  "ERROR: base-files revision expression not found"
              )

          # ------------------------------------------------
          # Fix third-party LuCI versions such as:
          # 1.0.0-r3 + PKG_RELEASE=1 -> 1.0.0-r3-r1 (invalid APK)
          # ------------------------------------------------
          root = Path("package/feeds/kiddin9")

          fixed = 0

          for makefile in root.glob("*/Makefile"):
              text = makefile.read_text()

              m = re.search(
                  r'^PKG_VERSION:=(.+)$',
                  text,
                  flags=re.MULTILINE
              )

              if not m:
                  continue

              version = m.group(1).strip()

              if not re.search(r'-r[0-9]+$', version):
                  continue

              release = re.search(
                  r'^PKG_RELEASE:=(.*)$',
                  text,
                  flags=re.MULTILINE
              )

              if release and release.group(1).strip():
                  print(
                      f"Fixing {makefile}: "
                      f"PKG_VERSION={version}, "
                      f"PKG_RELEASE={release.group(1).strip()}"
                  )

                  text = re.sub(
                      r'^PKG_RELEASE:=.*$',
                      'PKG_RELEASE:=',
                      text,
                      count=1,
                      flags=re.MULTILINE
                  )

                  makefile.write_text(text)
                  fixed += 1

          print(f"Fixed {fixed} KWRT package version(s).")

          PY

          echo
          echo "luci-app-fan version after APK fix:"
          grep -E '^PKG_VERSION:=|^PKG_RELEASE:=' \
            package/feeds/kiddin9/luci-app-fan/Makefile

          echo
          echo "base-files APK version expression:"
          grep -n 'REVISION' package/base-files/Makefile

      - name: Fix KWRT conntrack build on kernel 6.12
        shell: bash
        run: |
          set -e
          cd openwrt

          cat > target/linux/generic/hack-6.12/954-fix-conntrack-unused-function.patch <<'EOF'
          --- a/net/netfilter/nf_conntrack_ecache.c
          +++ b/net/netfilter/nf_conntrack_ecache.c
          @@ -127,7 +127,7 @@ static void ecache_work(struct work_struct *work)
           		schedule_delayed_work(&cnet->ecache.dwork, delay);
           }
           
          -static int __nf_conntrack_eventmask_report(struct nf_conntrack_ecache *e,
          +static int __maybe_unused __nf_conntrack_eventmask_report(struct nf_conntrack_ecache *e,
           					   const u32 events,
           					   const u32 missed,
           					   const struct nf_ct_event *item)
          EOF

          cat > target/linux/generic/hack-6.12/955-fix-ctnetlink-expect-unused-function.patch <<'EOF'
          --- a/net/netfilter/nf_conntrack_netlink.c
          +++ b/net/netfilter/nf_conntrack_netlink.c
          @@ -3099,2 +3099,2 @@
          -static int
          +static int __maybe_unused
           ctnetlink_expect_event(unsigned int events, const struct nf_exp_event *item)
          EOF

          echo "Added kernel 6.12 conntrack compatibility patches:"
          cat target/linux/generic/hack-6.12/954-fix-conntrack-unused-function.patch
          cat target/linux/generic/hack-6.12/955-fix-ctnetlink-expect-unused-function.patch

      - name: Apply TOTOLINK X30 support
        shell: bash
        run: |
          set -e
          cd openwrt

          echo "Checking X30 profile..."

          if grep -q \
            'Device/totolink_X30' \
            target/linux/mediatek/image/filogic.mk; then

            echo "X30 already exists upstream."
          else
            echo "Applying X30 board-support patch..."

            patch \
              -p1 \
              -F1 \
              --no-backup-if-mismatch \
              < ../patches/0001-mediatek-add-TOTOLINK-X30-support.patch
          fi

          echo "Verifying X30 DTS..."

          test -f \
            target/linux/mediatek/dts/mt7981b-totolink-X30.dts

          grep -q \
            'compatible = "totolink,x30", "mediatek,mt7981";' \
            target/linux/mediatek/dts/mt7981b-totolink-X30.dts

          grep -q \
            'pinctrl-0 = <&mdio_pins>;' \
            target/linux/mediatek/dts/mt7981b-totolink-X30.dts

          grep -q \
            'SUPPORTED_DEVICES := totolink,X30 totolink,x30' \
            target/linux/mediatek/image/filogic.mk

      - name: Add X30 FIT sysupgrade support
        shell: bash
        run: |
          set -e
          cd openwrt

          PLATFORM_SH="target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh"

          echo "Adding X30 to FIT upgrade/check lists..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh")
          s = p.read_text()

          anchor = "\twavlink,wl-wnt100x3-ubootmod|\\\n"

          addition = (
              "\ttotolink,X30|\\\n"
              "\ttotolink,x30|\\\n"
              + anchor
          )

          upper = s.count("totolink,X30")
          lower = s.count("totolink,x30")

          print(f"Before: totolink,X30={upper}, totolink,x30={lower}")

          if upper == 0 and lower == 0:
              count = s.count(anchor)

              if count != 2:
                  raise SystemExit(
                      f"ERROR: expected 2 FIT anchors, found {count}"
                  )

              s = s.replace(anchor, addition)
              p.write_text(s)

          elif upper == 2 and lower == 2:
              print("X30 FIT entries already present.")

          else:
              raise SystemExit(
                  f"ERROR: unexpected existing X30 entries: "
                  f"upper={upper}, lower={lower}"
              )
          PY

          echo
          echo "X30 entries after modification:"
          grep -n -B3 -A3 \
            -E 'totolink,X30|totolink,x30' \
            "$PLATFORM_SH"

          UPPER_COUNT="$(grep -c 'totolink,X30' "$PLATFORM_SH" || true)"
          LOWER_COUNT="$(grep -c 'totolink,x30' "$PLATFORM_SH" || true)"

          echo
          echo "Final count:"
          echo "totolink,X30 = ${UPPER_COUNT}"
          echo "totolink,x30 = ${LOWER_COUNT}"

          if [ "$UPPER_COUNT" -ne 2 ] || \
             [ "$LOWER_COUNT" -ne 2 ]; then
            echo "ERROR: X30 FIT sysupgrade entries are incomplete."
            exit 1
          fi

      - name: Configure X30
        shell: bash
        run: |
          set -e
          cd openwrt

          cp ../config/x30.config .config

          echo "X30 seed config:"
          cat .config

          make defconfig

          echo
          echo "Resolved X30 configuration:"
          grep -E \
            'CONFIG_TARGET_mediatek|DEVICE_totolink_X30|CONFIG_PACKAGE_luci' \
            .config || true

          grep -q \
            '^CONFIG_TARGET_mediatek_filogic_DEVICE_totolink_X30=y' \
            .config

          echo
          echo "Diffconfig:"
          ./scripts/diffconfig.sh

      - name: Download sources
        working-directory: openwrt
        shell: bash
        run: |
          set -e
          make download -j"$(nproc)"

      - name: Build KWRT X30
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FULL BUILD ==="

          make -j"${BUILD_JOBS}" V=s \
            2>&1 | tee ../build.log

      - name: Collect firmware
        shell: bash
        run: |
          set -e

          mkdir -p out

          TARGET_DIR="openwrt/bin/targets/mediatek/filogic"

          echo "Files generated:"
          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

          find "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*totolink*x30*' \
              -o \
              -iname '*x30*' \
            \) \
            -exec cp -v {} out/ \;

          cp openwrt/.config out/x30-full.config
          (cd openwrt && ./scripts/diffconfig.sh) > out/x30.diffconfig

          git -C openwrt rev-parse HEAD \
            > out/openwrt-git-head.txt

          git -C kwrt rev-parse HEAD \
            > out/kwrt-git-head.txt

          cd out
          sha256sum * > BUILD-SHA256SUMS.txt

          echo
          echo "Final X30 artifacts:"
          ls -lh

          if ! find . \
            -maxdepth 1 \
            -type f \
            -iname '*x30*sysupgrade*.bin' \
            | grep -q .; then

            echo "ERROR: X30 sysupgrade image was not generated."
            exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-totolink-x30
          path: out/
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="kwrt-x30-${{ github.run_number }}"

          gh release create "$TAG" \
            out/* \
            --target "${{ github.sha }}" \
            --title "KWRT TOTOLINK X30 Build ${{ github.run_number }}" \
            --notes "Automated KWRT 25.12 build for TOTOLINK X30."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kwrt-x30-build-failure
          path: |
            build.log
            openwrt/.config
            openwrt/logs/**
          if-no-files-found: ignore
